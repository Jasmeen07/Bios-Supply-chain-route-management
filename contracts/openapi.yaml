openapi: 3.1.0
info:
  title: SupplySense API
  description: Intelligent Supply-Chain Risk and Route Management Decision-Support
    Platform
  version: 1.0.0
paths:
  /api/health:
    get:
      tags:
      - Overview
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/overview:
    get:
      tags:
      - Overview
      summary: Overview
      operationId: overview_api_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewOut'
  /api/network:
    get:
      tags:
      - Network
      summary: Get Network
      operationId: get_network_api_network_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkOut'
  /api/disruptions:
    get:
      tags:
      - Disruptions
      summary: List Disruptions
      operationId: list_disruptions_api_disruptions_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by status (open, resolved)
          title: Status
        description: Filter by status (open, resolved)
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by type (weather, traffic, supplier_delay, inventory)
          title: Type
        description: Filter by type (weather, traffic, supplier_delay, inventory)
      - name: level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by risk level (low, medium, high)
          title: Level
        description: Filter by risk level (low, medium, high)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisruptionOut'
                title: Response List Disruptions Api Disruptions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/disruptions/{disruption_id}:
    get:
      tags:
      - Disruptions
      summary: Get Disruption
      operationId: get_disruption_api_disruptions__disruption_id__get
      parameters:
      - name: disruption_id
        in: path
        required: true
        schema:
          type: string
          title: Disruption Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/shipments:
    get:
      tags:
      - Shipments
      summary: List Shipments
      operationId: list_shipments_api_shipments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShipmentOut'
                type: array
                title: Response List Shipments Api Shipments Get
  /api/suppliers:
    get:
      tags:
      - Suppliers
      summary: List Suppliers
      operationId: list_suppliers_api_suppliers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SupplierOut'
                type: array
                title: Response List Suppliers Api Suppliers Get
  /api/routes/compare:
    get:
      tags:
      - Routes
      summary: Compare Routes
      operationId: compare_routes_api_routes_compare_get
      parameters:
      - name: shipment_id
        in: query
        required: true
        schema:
          type: string
          description: ID of shipment to compare routes for
          title: Shipment Id
        description: ID of shipment to compare routes for
      - name: priority
        in: query
        required: false
        schema:
          type: string
          description: 'Optimization priority: fastest, balanced, cheapest, safest'
          default: balanced
          title: Priority
        description: 'Optimization priority: fastest, balanced, cheapest, safest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCompareOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recommendations:
    get:
      tags:
      - Recommendations
      summary: List Recommendations
      operationId: list_recommendations_api_recommendations_get
      parameters:
      - name: disruption_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by disruption ID
          title: Disruption Id
        description: Filter by disruption ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendationOut'
                title: Response List Recommendations Api Recommendations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recommendations/{recommendation_id}/approve:
    post:
      tags:
      - Recommendations
      summary: Approve Recommendation
      operationId: approve_recommendation_api_recommendations__recommendation_id__approve_post
      parameters:
      - name: recommendation_id
        in: path
        required: true
        schema:
          type: string
          title: Recommendation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApproveResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/detect/run:
    post:
      tags:
      - Detection
      summary: Trigger Detection
      description: 'Manually triggers a full detection cycle across all 4 rules:

        weather, traffic, supplier delay, inventory shortage.'
      operationId: trigger_detection_api_detect_run_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/simulate:
    post:
      tags:
      - Simulate
      summary: Simulate
      description: Inject a disruption scenario (either by scenario_id or custom payload).
      operationId: simulate_api_simulate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/simulate/reset:
    post:
      tags:
      - Simulate
      summary: Reset
      description: Reset all simulation incidents and restore baseline seed network
        state.
      operationId: reset_api_simulate_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/simulate/scenarios:
    get:
      tags:
      - Simulate
      summary: List Scenarios
      description: Returns all registered scenarios for the frontend Simulator drawer.
      operationId: list_scenarios_api_simulate_scenarios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Scenarios Api Simulate Scenarios Get
components:
  schemas:
    ApproveResult:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        recommendation_id:
          type: string
          title: Recommendation Id
        disruption_id:
          type: string
          title: Disruption Id
        action_type:
          type: string
          title: Action Type
        before_risk_score:
          type: number
          title: Before Risk Score
        after_risk_score:
          type: number
          title: After Risk Score
        message:
          type: string
          title: Message
        applied_at:
          type: string
          title: Applied At
          default: ''
        applied:
          type: boolean
          title: Applied
          default: true
      type: object
      required:
      - recommendation_id
      - disruption_id
      - action_type
      - before_risk_score
      - after_risk_score
      - message
      title: ApproveResult
    DisruptionOut:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        entity:
          $ref: '#/components/schemas/EntityRef'
        severity:
          type: number
          title: Severity
        confidence:
          type: number
          title: Confidence
        risk_score:
          type: number
          title: Risk Score
        level:
          type: string
          title: Level
        status:
          type: string
          title: Status
        detected_at:
          type: string
          title: Detected At
        resolved_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolved At
        impact:
          anyOf:
          - $ref: '#/components/schemas/ImpactOut'
          - type: 'null'
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          type: array
          title: Evidence
          default: []
        recommendations:
          items:
            $ref: '#/components/schemas/RecommendationOut'
          type: array
          title: Recommendations
          default: []
        issue_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Issue Title
        impact_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Impact Summary
        time_ago:
          anyOf:
          - type: string
          - type: 'null'
          title: Time Ago
        history:
          items:
            additionalProperties: true
            type: object
          type: array
          title: History
          default: []
      type: object
      required:
      - id
      - type
      - entity
      - severity
      - confidence
      - risk_score
      - level
      - status
      - detected_at
      title: DisruptionOut
    EntityRef:
      properties:
        type:
          type: string
          title: Type
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - type
      - id
      - name
      title: EntityRef
    EvidenceItem:
      properties:
        source:
          type: string
          title: Source
        simulated:
          type: boolean
          title: Simulated
        metric:
          type: string
          title: Metric
        value:
          title: Value
        ts:
          type: string
          title: Ts
      type: object
      required:
      - source
      - simulated
      - metric
      - value
      - ts
      title: EvidenceItem
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthOut:
      properties:
        status:
          type: string
          title: Status
        db:
          type: string
          title: Db
        seed:
          type: integer
          title: Seed
        version:
          type: string
          title: Version
          default: 1.0.0
      type: object
      required:
      - status
      - db
      - seed
      title: HealthOut
    ImpactOut:
      properties:
        affected_shipments:
          items:
            type: string
          type: array
          title: Affected Shipments
        extra_delay_h:
          type: number
          title: Extra Delay H
        stockout_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Stockout Date
        units_short:
          type: number
          title: Units Short
        revenue_at_risk:
          type: number
          title: Revenue At Risk
        margin_at_risk:
          type: number
          title: Margin At Risk
          default: 0.0
      type: object
      required:
      - affected_shipments
      - extra_delay_h
      - stockout_date
      - units_short
      - revenue_at_risk
      title: ImpactOut
    KpiCards:
      properties:
        active_disruptions:
          type: integer
          title: Active Disruptions
          default: 0
        high_risk_shipments:
          type: integer
          title: High Risk Shipments
          default: 0
        revenue_at_risk:
          type: number
          title: Revenue At Risk
          default: 0.0
        avg_delay_h:
          type: number
          title: Avg Delay H
          default: 0.0
        total_active_risks:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Active Risks
        high_severity_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: High Severity Count
        total_shipments_at_risk:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Shipments At Risk
        total_revenue_at_risk:
          anyOf:
          - type: number
          - type: 'null'
          title: Total Revenue At Risk
        on_time_network_rate:
          anyOf:
          - type: number
          - type: 'null'
          title: On Time Network Rate
      type: object
      title: KpiCards
    LaneOut:
      properties:
        id:
          type: string
          title: Id
        from_id:
          type: string
          title: From Id
        to_id:
          type: string
          title: To Id
        from_name:
          anyOf:
          - type: string
          - type: 'null'
          title: From Name
        to_name:
          anyOf:
          - type: string
          - type: 'null'
          title: To Name
        distance_km:
          type: number
          title: Distance Km
        baseline_duration_s:
          type: number
          title: Baseline Duration S
        cost:
          type: number
          title: Cost
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
        approximate:
          type: boolean
          title: Approximate
          default: false
        risk_score:
          type: number
          title: Risk Score
          default: 0.0
        risk_level:
          type: string
          title: Risk Level
          default: low
        level:
          anyOf:
          - type: string
          - type: 'null'
          title: Level
          default: low
        current_duration_s:
          type: number
          title: Current Duration S
          default: 0.0
      type: object
      required:
      - id
      - from_id
      - to_id
      - distance_km
      - baseline_duration_s
      - cost
      - geometry
      title: LaneOut
    LocationOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        lat:
          type: number
          title: Lat
        lng:
          type: number
          title: Lng
      type: object
      required:
      - id
      - name
      - type
      - lat
      - lng
      title: LocationOut
    NetworkOut:
      properties:
        locations:
          items:
            $ref: '#/components/schemas/LocationOut'
          type: array
          title: Locations
        lanes:
          items:
            $ref: '#/components/schemas/LaneOut'
          type: array
          title: Lanes
      type: object
      required:
      - locations
      - lanes
      title: NetworkOut
    OverviewOut:
      properties:
        kpis:
          $ref: '#/components/schemas/KpiCards'
        risk_by_cause:
          $ref: '#/components/schemas/RiskByCause'
        active_risks_by_cause:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Active Risks By Cause
        top_risky_lanes:
          items:
            $ref: '#/components/schemas/RiskyLane'
          type: array
          title: Top Risky Lanes
          default: []
        regional_risk_levels:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Regional Risk Levels
        recent_disruptions:
          items:
            $ref: '#/components/schemas/DisruptionOut'
          type: array
          title: Recent Disruptions
          default: []
        top_recommendations:
          items:
            $ref: '#/components/schemas/RecommendationOut'
          type: array
          title: Top Recommendations
          default: []
        recommended_actions:
          anyOf:
          - items:
              $ref: '#/components/schemas/RecommendationOut'
            type: array
          - type: 'null'
          title: Recommended Actions
        network_status:
          type: string
          title: Network Status
          default: operational
      type: object
      required:
      - kpis
      - risk_by_cause
      title: OverviewOut
    RecommendationOut:
      properties:
        id:
          type: string
          title: Id
        disruption_id:
          type: string
          title: Disruption Id
        rank:
          type: integer
          title: Rank
        action_type:
          type: string
          title: Action Type
        title:
          type: string
          title: Title
        explanation:
          type: string
          title: Explanation
        delay_saved_h:
          type: number
          title: Delay Saved H
        cost_delta:
          type: number
          title: Cost Delta
        cost_delta_pct:
          type: number
          title: Cost Delta Pct
        risk_reduction:
          type: number
          title: Risk Reduction
        confidence:
          type: number
          title: Confidence
        status:
          type: string
          title: Status
        params:
          additionalProperties: true
          type: object
          title: Params
          default: {}
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          type: array
          title: Evidence
          default: []
        feasible:
          type: boolean
          title: Feasible
          default: true
      type: object
      required:
      - id
      - disruption_id
      - rank
      - action_type
      - title
      - explanation
      - delay_saved_h
      - cost_delta
      - cost_delta_pct
      - risk_reduction
      - confidence
      - status
      title: RecommendationOut
    RiskByCause:
      properties:
        weather:
          type: integer
          title: Weather
          default: 0
        traffic:
          type: integer
          title: Traffic
          default: 0
        supplier_delay:
          type: integer
          title: Supplier Delay
          default: 0
        inventory:
          type: integer
          title: Inventory
          default: 0
        inventory_shortage:
          anyOf:
          - type: integer
          - type: 'null'
          title: Inventory Shortage
        geopolitical:
          type: integer
          title: Geopolitical
          default: 0
      type: object
      title: RiskByCause
    RiskyLane:
      properties:
        lane_id:
          type: string
          title: Lane Id
        name:
          type: string
          title: Name
        risk_score:
          type: number
          title: Risk Score
        level:
          type: string
          title: Level
      type: object
      required:
      - lane_id
      - name
      - risk_score
      - level
      title: RiskyLane
    RouteCompareOut:
      properties:
        shipment_id:
          type: string
          title: Shipment Id
        priority:
          type: string
          title: Priority
        current:
          $ref: '#/components/schemas/RouteOption'
        alternatives:
          items:
            $ref: '#/components/schemas/RouteOption'
          type: array
          title: Alternatives
      type: object
      required:
      - shipment_id
      - priority
      - current
      - alternatives
      title: RouteCompareOut
    RouteDelta:
      properties:
        duration_h:
          type: number
          title: Duration H
        cost_pct:
          type: number
          title: Cost Pct
        risk:
          type: number
          title: Risk
      type: object
      required:
      - duration_h
      - cost_pct
      - risk
      title: RouteDelta
    RouteOption:
      properties:
        route_id:
          type: string
          title: Route Id
          default: current_route
        route_name:
          type: string
          title: Route Name
          default: Current Route
        lane_ids:
          items:
            type: string
          type: array
          title: Lane Ids
        distance_km:
          type: number
          title: Distance Km
          default: 0.0
        duration_h:
          type: number
          title: Duration H
        cost:
          type: number
          title: Cost
        risk_score:
          type: number
          title: Risk Score
        level:
          type: string
          title: Level
          default: low
        geometry:
          additionalProperties: true
          type: object
          title: Geometry
        delta:
          anyOf:
          - $ref: '#/components/schemas/RouteDelta'
          - type: 'null'
        rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rank
        label:
          type: string
          title: Label
          default: ''
        utility:
          anyOf:
          - type: number
          - type: 'null'
          title: Utility
      type: object
      required:
      - lane_ids
      - duration_h
      - cost
      - risk_score
      - geometry
      title: RouteOption
    ShipmentOut:
      properties:
        id:
          type: string
          title: Id
        supplier_id:
          type: string
          title: Supplier Id
        origin_id:
          type: string
          title: Origin Id
        destination_id:
          type: string
          title: Destination Id
        sku:
          type: string
          title: Sku
        qty:
          type: number
          title: Qty
        route_lane_ids:
          items:
            type: string
          type: array
          title: Route Lane Ids
        status:
          type: string
          title: Status
        planned_eta:
          type: string
          title: Planned Eta
        current_eta:
          type: string
          title: Current Eta
        origin_name:
          type: string
          title: Origin Name
          default: ''
        destination_name:
          type: string
          title: Destination Name
          default: ''
        supplier_name:
          type: string
          title: Supplier Name
          default: ''
        sku_name:
          type: string
          title: Sku Name
          default: ''
        risk_score:
          type: number
          title: Risk Score
          default: 0.0
        risk_level:
          type: string
          title: Risk Level
          default: low
        delay_hours:
          type: number
          title: Delay Hours
          default: 0.0
        delay_h:
          type: number
          title: Delay H
          default: 0.0
      type: object
      required:
      - id
      - supplier_id
      - origin_id
      - destination_id
      - sku
      - qty
      - route_lane_ids
      - status
      - planned_eta
      - current_eta
      title: ShipmentOut
    SimulateRequest:
      properties:
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
        custom:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Custom
      type: object
      title: SimulateRequest
    SimulateResult:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        scenario_id:
          type: string
          title: Scenario Id
        description:
          type: string
          title: Description
        disruptions_created:
          type: integer
          title: Disruptions Created
        disruption_ids:
          items:
            type: string
          type: array
          title: Disruption Ids
        injected_disruption_id:
          type: string
          title: Injected Disruption Id
          default: ''
        status:
          type: string
          title: Status
          default: active
        message:
          type: string
          title: Message
      type: object
      required:
      - scenario_id
      - description
      - disruptions_created
      - disruption_ids
      - message
      title: SimulateResult
    SupplierOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        location_id:
          type: string
          title: Location Id
        location_name:
          type: string
          title: Location Name
          default: ''
        base_lead_time_days:
          type: number
          title: Base Lead Time Days
        reliability:
          type: number
          title: Reliability
        reliability_score:
          type: number
          title: Reliability Score
          default: 0.0
        active_disruptions_count:
          type: integer
          title: Active Disruptions Count
          default: 0
        current_delay_days:
          type: number
          title: Current Delay Days
          default: 0.0

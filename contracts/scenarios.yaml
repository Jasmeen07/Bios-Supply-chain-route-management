version: "1.0.0"
scenarios:
  # ── Positive Scenarios ────────────────────────────────────────────────────────
  - id: "SCN_01"
    name: "Heavy Rain on Western Freight Corridor"
    description: "Heavy rain and thunderstorm forecast along the Pune to Delhi freight corridor."
    type: "weather"
    entity_type: "lane"
    entity_id: "L_pune_delhi"
    severity_min: 0.75
    expected_level: "high"
    acceptable_actions: ["reroute", "expedite", "monitor"]
    inject:
      kind: "weather"
      lane_id: "L_pune_delhi"
      precip_mm: 35.0
      gust_kmh: 85.0
      weather_code: 95

  - id: "SCN_02"
    name: "Highway Closure: Nagpur to Hyderabad"
    description: "Major highway disruption and blockage between Nagpur and Hyderabad."
    type: "traffic"
    entity_type: "lane"
    entity_id: "L_nagpur_hyderabad"
    severity_min: 0.8
    expected_level: "high"
    acceptable_actions: ["reroute", "monitor"]
    inject:
      kind: "traffic"
      lane_id: "L_nagpur_hyderabad"
      ratio: 2.2

  - id: "SCN_03"
    name: "Severe Congestion: Delhi to Jaipur"
    description: "Gridlock and heavy peak hour traffic delay along NH48 Delhi NCR to Jaipur."
    type: "traffic"
    entity_type: "lane"
    entity_id: "L_delhi_jaipur"
    severity_min: 0.6
    expected_level: "medium"
    acceptable_actions: ["reroute", "expedite", "monitor"]
    inject:
      kind: "traffic"
      lane_id: "L_delhi_jaipur"
      ratio: 1.65

  - id: "SCN_04"
    name: "Pune Supplier 48h Delay"
    description: "Pune component manufacturing hub reports factory equipment breakdown and 48-hour delivery delay."
    type: "supplier_delay"
    entity_type: "supplier"
    entity_id: "SUP-PUNE"
    severity_min: 0.7
    expected_level: "high"
    acceptable_actions: ["alternate_supplier", "expedite", "monitor"]
    inject:
      kind: "supplier"
      supplier_id: "SUP-PUNE"
      added_delay_hours: 48.0

  - id: "SCN_05"
    name: "Chennai Supplier Reliability Drop"
    description: "Chennai supplier delivery drift increases lead-time variance and lowers on-time performance."
    type: "supplier_delay"
    entity_type: "supplier"
    entity_id: "SUP-CHENNAI"
    severity_min: 0.45
    expected_level: "medium"
    acceptable_actions: ["alternate_supplier", "expedite", "monitor"]
    inject:
      kind: "supplier"
      supplier_id: "SUP-CHENNAI"
      added_delay_hours: 36.0

  - id: "SCN_06"
    name: "Delhi Warehouse Stockout Risk"
    description: "Delhi NCR central distribution hub inventory for fast-moving SKU-ELEC drops to 2 days of cover."
    type: "inventory"
    entity_type: "location_sku"
    entity_id: "delhi::SKU-ELEC"
    severity_min: 0.65
    expected_level: "high"
    acceptable_actions: ["rebalance", "increase_safety_stock", "expedite", "monitor"]
    inject:
      kind: "inventory"
      location_id: "delhi"
      sku: "SKU-ELEC"
      on_hand: 50.0

  - id: "SCN_07"
    name: "Compound Disruption: Supplier Delay & Low Stock"
    description: "Ludhiana supplier delayed while Delhi hub on-hand cover is depleted, triggering corroboration."
    type: "supplier_delay"
    entity_type: "supplier"
    entity_id: "SUP-LUDHIANA"
    severity_min: 0.7
    expected_level: "high"
    acceptable_actions: ["alternate_supplier", "rebalance", "expedite", "increase_safety_stock", "monitor"]
    inject:
      kind: "compound_supplier_inventory"
      supplier_id: "SUP-LUDHIANA"
      added_delay_hours: 48.0
      location_id: "delhi"
      sku: "SKU-FASH"
      on_hand: 40.0

  - id: "SCN_08"
    name: "Compound Corroboration: Storm & Traffic on Surat-Delhi Corridor"
    description: "Both torrential downpour and multi-vehicle accident hit the Surat to Delhi corridor simultaneously."
    type: "traffic"
    entity_type: "lane"
    entity_id: "L_surat_delhi"
    severity_min: 0.8
    expected_level: "high"
    acceptable_actions: ["reroute", "expedite", "monitor"]
    inject:
      kind: "compound_weather_traffic"
      lane_id: "L_surat_delhi"
      precip_mm: 28.0
      ratio: 1.85

  - id: "SCN_09"
    name: "Severe Storm: Delhi to Lucknow"
    description: "Severe thunderstorm with cyclonic winds along the Yamuna & Agra-Lucknow Expressway."
    type: "weather"
    entity_type: "lane"
    entity_id: "L_delhi_lucknow"
    severity_min: 0.75
    expected_level: "high"
    acceptable_actions: ["reroute", "expedite", "monitor"]
    inject:
      kind: "weather"
      lane_id: "L_delhi_lucknow"
      precip_mm: 32.0
      gust_kmh: 92.0
      weather_code: 96

  - id: "SCN_10"
    name: "Traffic Gridlock: Bengaluru to Chennai"
    description: "Industrial transit bottleneck and bridge repair on Bengaluru to Chennai corridor."
    type: "traffic"
    entity_type: "lane"
    entity_id: "L_bengaluru_chennai"
    severity_min: 0.65
    expected_level: "high"
    acceptable_actions: ["reroute", "expedite", "monitor"]
    inject:
      kind: "traffic"
      lane_id: "L_bengaluru_chennai"
      ratio: 1.75

  - id: "SCN_11"
    name: "Ludhiana Supplier Raw Material Shortage"
    description: "Ludhiana fabric mill encounters power outage causing 40-hour shipment postponement."
    type: "supplier_delay"
    entity_type: "supplier"
    entity_id: "SUP-LUDHIANA"
    severity_min: 0.6
    expected_level: "high"
    acceptable_actions: ["alternate_supplier", "expedite", "monitor"]
    inject:
      kind: "supplier"
      supplier_id: "SUP-LUDHIANA"
      added_delay_hours: 40.0

  - id: "SCN_12"
    name: "Surat Supplier Dispatch Delay"
    description: "Surat chemical supplier customs inspection hold adds 36 hours to scheduled dispatch."
    type: "supplier_delay"
    entity_type: "supplier"
    entity_id: "SUP-SURAT"
    severity_min: 0.55
    expected_level: "medium"
    acceptable_actions: ["alternate_supplier", "expedite", "monitor"]
    inject:
      kind: "supplier"
      supplier_id: "SUP-SURAT"
      added_delay_hours: 36.0

  - id: "SCN_13"
    name: "Bengaluru Hub Stock Shortage SKU-PHMA"
    description: "Surge demand at southern stores drains Bengaluru warehouse buffer to 1.5 days."
    type: "inventory"
    entity_type: "location_sku"
    entity_id: "bengaluru::SKU-PHMA"
    severity_min: 0.7
    expected_level: "high"
    acceptable_actions: ["rebalance", "increase_safety_stock", "expedite", "monitor"]
    inject:
      kind: "inventory"
      location_id: "bengaluru"
      sku: "SKU-PHMA"
      on_hand: 25.0

  - id: "SCN_14"
    name: "Mumbai Store Stockout SKU-AUTO"
    description: "Retail surge empties Mumbai flagship store shelves for SKU-AUTO with 0 days of cover."
    type: "inventory"
    entity_type: "location_sku"
    entity_id: "mumbai::SKU-AUTO"
    severity_min: 0.85
    expected_level: "high"
    acceptable_actions: ["rebalance", "increase_safety_stock", "expedite", "monitor"]
    inject:
      kind: "inventory"
      location_id: "mumbai"
      sku: "SKU-AUTO"
      on_hand: 2.0

  - id: "SCN_15"
    name: "Monsoon Flood: Pune to Bengaluru"
    description: "Highway waterlogging on NH48 between Pune and Bengaluru halting freight carriers."
    type: "weather"
    entity_type: "lane"
    entity_id: "L_pune_bengaluru"
    severity_min: 0.8
    expected_level: "high"
    acceptable_actions: ["reroute", "expedite", "monitor"]
    inject:
      kind: "weather"
      lane_id: "L_pune_bengaluru"
      precip_mm: 42.0
      gust_kmh: 80.0
      weather_code: 95

  # ── Negative Scenarios (Expected: No High Disruption / Monitor) ─────────────
  - id: "SCN_NEG_01"
    name: "Normal Operations (Baseline)"
    description: "Nominal weather and traffic conditions across the entire Indian freight corridor."
    type: "none"
    entity_type: "none"
    entity_id: "none"
    severity_min: 0.0
    expected_level: "low"
    acceptable_actions: ["monitor"]
    inject:
      kind: "baseline"

  - id: "SCN_NEG_02"
    name: "Minor Traffic Bump"
    description: "Slight 10% traffic slowdown on Delhi to Jaipur corridor, well below disruption threshold."
    type: "traffic"
    entity_type: "lane"
    entity_id: "L_delhi_jaipur"
    severity_min: 0.0
    expected_level: "low"
    acceptable_actions: ["monitor"]
    inject:
      kind: "traffic"
      lane_id: "L_delhi_jaipur"
      ratio: 1.10

  - id: "SCN_NEG_03"
    name: "Light Rain on Delhi to Jaipur"
    description: "Mild 2 mm/h precipitation on Delhi-Jaipur highway, negligible impact on transit times."
    type: "weather"
    entity_type: "lane"
    entity_id: "L_delhi_jaipur"
    severity_min: 0.0
    expected_level: "low"
    acceptable_actions: ["monitor"]
    inject:
      kind: "weather"
      lane_id: "L_delhi_jaipur"
      precip_mm: 2.0
      gust_kmh: 15.0
      weather_code: 51

  - id: "SCN_NEG_04"
    name: "Normal Supplier Variance"
    description: "Minor 1-hour delivery variance for Pune supplier, within standard tolerance window."
    type: "supplier_delay"
    entity_type: "supplier"
    entity_id: "SUP-PUNE"
    severity_min: 0.0
    expected_level: "low"
    acceptable_actions: ["monitor"]
    inject:
      kind: "supplier"
      supplier_id: "SUP-PUNE"
      added_delay_hours: 1.0

  - id: "SCN_NEG_05"
    name: "Adequate Safety Stock"
    description: "Stock is slightly below maximum target but well above replenishment lead-time cover."
    type: "inventory"
    entity_type: "location_sku"
    entity_id: "delhi::SKU-ELEC"
    severity_min: 0.0
    expected_level: "low"
    acceptable_actions: ["monitor"]
    inject:
      kind: "inventory"
      location_id: "delhi"
      sku: "SKU-ELEC"
      on_hand: 550.0
